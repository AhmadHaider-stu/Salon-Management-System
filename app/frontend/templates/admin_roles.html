{% extends "base.html" %}

{% block title %}Roles · Salon-Management-System{% endblock %}

{% block content %}
{% set lang = request.session.get('lang', 'ar') %}
<div class="page" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
  <div class="page-title" id="pageTitle"></div>
  <div class="page-sub" id="pageSub"></div>

  <div id="pageError" style="display:none;" class="error-banner"></div>

  <div class="field-group">
    <input type="text" id="userSearch" class="field-input" style="font-family: var(--font-body);" />
  </div>

  <div id="userList"></div>
</div>

<script>
  document.getElementById('pageTitle').textContent = t('roles_title');
  document.getElementById('pageSub').textContent = t('roles_sub');
  document.getElementById('userSearch').placeholder = t('search_placeholder');

  var allUsers = [];
  var currentUserId = {{ user.id }};

  function showError(message) {
    var el = document.getElementById('pageError');
    el.textContent = message;
    el.style.display = 'block';
  }
  function clearError() {
    document.getElementById('pageError').style.display = 'none';
  }

  function roleBadgeClass(role) {
    return 'status-badge role-badge-' + role;
  }
  function roleLabel(role) {
    var entry = window.ROLE_LABELS[role];
    if (entry) return entry[window.LANG] || entry.en;
    return role;
  }

  async function loadUsers() {
    clearError();
    var res = await fetch('/user/all');
    allUsers = await res.json();
    renderUsers();
  }

  function renderUsers() {
    var query = document.getElementById('userSearch').value.trim().toLowerCase();
    var filtered = allUsers.filter(function (u) {
      if (!query) return true;
      var name = (u.f_name + ' ' + u.l_name).toLowerCase();
      var email = (u.email || '').toLowerCase();
      return name.indexOf(query) !== -1 || email.indexOf(query) !== -1;
    });

    var list = document.getElementById('userList');
    list.innerHTML = '';

    if (filtered.length === 0) {
      list.innerHTML = '<div class="cart-empty">' + t('no_users_found') + '</div>';
      return;
    }

    filtered.forEach(function (u) {
      list.appendChild(buildUserCard(u));
    });
  }

  function buildUserCard(u) {
    var card = document.createElement('div');
    card.className = 'cal-card';

    var role = u.role.toLowerCase();
    var actionsHtml = '';

    if (role === 'client') {
      actionsHtml = '<button type="button" class="role-action-btn primary" data-action="make_employee">' + t('promote_to_employee') + '</button>';
    } else if (role === 'employee') {
      actionsHtml =
        '<button type="button" class="role-action-btn primary" data-action="make_receptionist">' + t('make_receptionist_btn') + '</button>' +
        '<button type="button" class="role-action-btn primary" data-action="make_admin">' + t('make_admin_btn') + '</button>' +
        '<button type="button" class="role-action-btn" data-action="delete_employee">' + t('remove_as_employee') + '</button>';
    } else if (role === 'receptionist') {
      actionsHtml = '<button type="button" class="role-action-btn" data-action="delete_receptionist">' + t('remove_as_receptionist') + '</button>';
    } else if (role === 'admin') {
      actionsHtml = u.id === currentUserId
        ? '<div class="card-readonly-line">' + t('this_is_you') + '</div>'
        : '<button type="button" class="role-action-btn" data-action="delete_admin">' + t('remove_as_admin') + '</button>';
    }

    card.innerHTML =
      '<div class="cal-card-top">' +
      '<div>' +
      '<div class="cal-card-time">' + escapeHtml(u.f_name) + ' ' + escapeHtml(u.l_name) + '</div>' +
      '<div class="cal-card-sub">' + (u.email ? escapeHtml(u.email) : t('no_email')) + '</div>' +
      '</div>' +
      '<span class="' + roleBadgeClass(role) + '">' + roleLabel(role) + '</span>' +
      '</div>' +
      '<div class="role-actions">' + actionsHtml + '</div>';

    card.querySelectorAll('.role-action-btn[data-action]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        performRoleAction(btn.getAttribute('data-action'), u.id);
      });
    });

    return card;
  }

  var ACTION_CONFIG = {
    make_employee: { method: 'POST', path: '/role/make_employee/' },
    make_receptionist: { method: 'PUT', path: '/role/make_receptionist/' },
    make_admin: { method: 'PUT', path: '/role/make_admin/' },
    delete_employee: { method: 'DELETE', path: '/role/delete_employee/', confirmKey: 'confirm_remove_employee' },
    delete_receptionist: { method: 'DELETE', path: '/role/delete_receptionist/', confirmKey: 'confirm_remove_receptionist' },
    delete_admin: { method: 'DELETE', path: '/role/delete_admin/', confirmKey: 'confirm_remove_admin' }
  };

  function extractErrorMessage(data) {
    if (!data || !data.detail) return t('err_generic_action');
    if (typeof data.detail === 'string') return data.detail;
    if (Array.isArray(data.detail)) {
      return data.detail.map(function (e) { return escapeHtml(e.msg || JSON.stringify(e)); }).join(', ');
    }
    return t('err_generic_action');
  }

  async function performRoleAction(action, userId) {
    var config = ACTION_CONFIG[action];
    if (config.confirmKey && !confirm(t(config.confirmKey))) return;

    clearError();
    var res = await fetch(config.path + userId, { method: config.method });

    if (res.ok) {
      loadUsers();
    } else {
      var data = await res.json();
      showError(extractErrorMessage(data));
    }
  }

  document.getElementById('userSearch').addEventListener('input', renderUsers);

  loadUsers();
</script>
{% endblock %}
