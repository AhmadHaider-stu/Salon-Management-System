<!DOCTYPE html>
<html>

<head>
  <title>{% block title %}Ayman Matar Salon{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}" />
</head>

<body>
  <script>
    window.LANG = "{{ request.session.get('lang', 'ar') }}";
    window.CATEGORY_LABELS = {{ CATEGORY_LABELS_JSON | safe }};
    window.STRINGS = {{ STRINGS_JSON | safe }};
    window.STATUS_LABELS = {{ STATUS_LABELS_JSON | safe }};
    window.ROLE_LABELS = {{ ROLE_LABELS_JSON | safe }};
    function t(key) { return (window.STRINGS[key] && window.STRINGS[key][window.LANG]) || key; }
    function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
    }
    function safeUrl(url) {
      if (!url) return '';
      var trimmed = String(url).trim();
      if (/^https?:\/\//i.test(trimmed)) return escapeHtml(trimmed);
      return '';    
    }
  </script>

  {% from "_icons.html" import icon %}

  <div class="demo-banner">Demo version — for testing purposes only</div>

  <nav class="app-nav">
    <a href="{{ brand_href | default('/home') }}" class="nav-brand">
      <span>Ayman Matar Salon</span>
      <div class="barber-pole"></div>
    </a>
    <div class="nav-items-scroll">
      {% for link in nav_links | default([]) %}
      <a href="{{ link.href }}" class="nav-item {% if active_page == link.key %}active{% endif %}">
        {{ icon(link.icon) }}
        <span>{{ t(request, link.key) }}</span>
      </a>
      {% endfor %}
    </div>
    </nav>

  <div class="app-body">
    {% block content %}{% endblock %}
  </div>
</body>

</html>
