<!DOCTYPE html>
<html>

<head>
  <title>{% block title %}Ayman Matar Salon{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}" />
</head>

<body>
  {% from "_icons.html" import icon %}

  <div class="demo-banner">Demo version — for testing purposes only</div>

  <nav class="app-nav">
    <a href="{{ brand_href | default('/home') }}" class="nav-brand">Ayman Matar Salon</a>
    <div class="nav-items-scroll">
      {% for link in nav_links | default([]) %}
      <a href="{{ link.href }}" class="nav-item {% if active_page == link.key %}active{% endif %}">
        {{ icon(link.icon) }}
        <span>{{ link.label }}</span>
      </a>
      {% endfor %}
    </div>
  </nav>

  <div class="app-body">
    {% block content %}{% endblock %}
  </div>
</body>

</html>
