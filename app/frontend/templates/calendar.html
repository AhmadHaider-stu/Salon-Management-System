{% extends "base.html" %}

{% block title %}Calendar · Salon-Management-System{% endblock %}

{% block content %}
{% set lang = request.session.get('lang', 'ar') %}
<div class="page" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
  <div class="page-title" id="pageTitle"></div>
  <div class="page-sub" id="pageSub"></div>

  <div id="pageError" style="display:none;" class="error-banner"></div>

  <div class="calendar-controls">
    <div class="view-toggle">
      <button type="button" class="view-btn active" data-view="day" id="dayViewBtn"></button>
      <button type="button" class="view-btn" data-view="month" id="monthViewBtn"></button>
    </div>
    <input type="date" id="calDate" class="field-input" style="font-family: var(--font-body);" />
  </div>

  {% if is_staff %}
  <div class="date-field">
    <select id="employeeSelect" class="field-input" style="font-family: var(--font-body);">
      <option value="" id="allEmployeesOpt"></option>
    </select>
  </div>
  {% endif %}

  <div id="calendarBody"></div>
</div>

{% if is_staff %}
<button type="button" class="fab-btn" id="newApptFab" aria-label="New appointment">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div class="modal-overlay" id="walkinOverlay">
  <div class="modal-panel">
    <div class="modal-header">
      <div class="page-title" style="font-size:18px;margin-bottom:0;" id="wiModalTitle"></div>
      <button type="button" class="modal-close-btn" id="walkinCloseBtn">&times;</button>
    </div>

    <div id="walkinError" style="display:none;" class="error-banner"></div>

    <div class="section-title" id="wiClientTitle"></div>
    <div class="field-group">
      <input type="text" id="wiFirstName" class="field-input" style="font-family: var(--font-body);" />
    </div>
    <div class="field-group">
      <input type="text" id="wiLastName" class="field-input" style="font-family: var(--font-body);" />
    </div>
    <div class="field-group">
      <input type="tel" id="wiPhone" class="field-input" inputmode="numeric" pattern="[0-9+]*" style="font-family: var(--font-body);" />
    </div>

    <div class="section-title" style="margin-top:20px;" id="wiServicesTitle"></div>
    <div id="wiServicesList"></div>

    <div class="section-title" style="margin-top:20px;" id="wiCartTitle"></div>
    <div id="wiCartList"><div class="cart-empty" id="wiCartEmptyMsg"></div></div>

    <div class="date-field">
      <div class="section-title" id="wiDateTitle"></div>
      <input type="date" id="wiDateInput" class="field-input" style="font-family: var(--font-body);" />
    </div>

    <div class="date-field" id="wiSlotsSection" style="display:none;">
      <div class="section-title" id="wiSlotsTitle"></div>
      <div id="wiSlotsGrid" class="slots-grid"></div>
    </div>

    <button type="button" class="btn btn-primary" id="wiSubmitBtn" style="margin-top:16px;"></button>
  </div>
</div>
{% endif %}

<script>
  {% set is_staff = is_staff | default(false) %}
  {% set own_employee_id = own_employee_id | default(none) %}
  var isStaff = {{ 'true' if is_staff else 'false' }};
  var ownEmployeeId = {{ own_employee_id if own_employee_id else 'null' }};
  var currentView = 'day';
  var serviceMap = {};
  var clientMap = {};
  var employeeCache = {};

  document.getElementById('pageTitle').textContent = t('calendar_title');
  document.getElementById('pageSub').textContent = isStaff ? t('calendar_sub_staff') : t('calendar_sub_client');
  document.getElementById('dayViewBtn').textContent = t('day_view');
  document.getElementById('monthViewBtn').textContent = t('month_view');
  if (isStaff) {
    document.getElementById('allEmployeesOpt').textContent = t('all_employees');
    document.getElementById('wiModalTitle').textContent = t('new_appointment');
    document.getElementById('wiClientTitle').textContent = t('client_label');
    document.getElementById('wiFirstName').placeholder = t('first_name');
    document.getElementById('wiLastName').placeholder = t('last_name');
    document.getElementById('wiPhone').placeholder = t('phone_label');
    document.getElementById('wiServicesTitle').textContent = t('services_title');
    document.getElementById('wiCartTitle').textContent = t('cart_label');
    document.getElementById('wiCartEmptyMsg').textContent = t('no_services_yet');
    document.getElementById('wiDateTitle').textContent = t('choose_date');
    document.getElementById('wiSlotsTitle').textContent = t('available_times');
    document.getElementById('wiSubmitBtn').textContent = t('create_appointment_btn');
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function formatTime(iso) {
    var locale = window.LANG === 'ar' ? 'ar-u-nu-latn' : 'en-US';
    return new Date(iso).toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
  }
  function formatPrice(value) {
    var amount = Number(value).toFixed(0);
    return window.LANG === 'ar' ? (amount + ' ' + t('currency')) : (t('currency') + ' ' + amount);
  }
  function categoryLabel(category) {
    var entry = window.CATEGORY_LABELS[category];
    if (entry) return entry[window.LANG] || entry.ar;
    return category.charAt(0).toUpperCase() + category.slice(1).toLowerCase();
  }
  function statusLabel(status) {
    var entry = window.STATUS_LABELS[status.toLowerCase()];
    if (entry) return entry[window.LANG] || entry.en;
    return status;
  }

  async function loadClientMap() {
    if (!isStaff) return;
    var res = await fetch('/client');
    var clients = await res.json();
    clients.forEach(function (c) { clientMap[c.id] = escapeHtml(c.f_name) + ' ' + escapeHtml(c.l_name); });
  }

  async function loadServiceMap() {
    var res = await fetch('/service/all');
    var services = await res.json();
    services.forEach(function (s) { serviceMap[s.id] = escapeHtml(s.description); });
  }

  async function resolveEmployeeName(serviceId, employeeId) {
    if (!employeeCache[serviceId]) {
      var res = await fetch('/service/' + serviceId + '/employees');
      employeeCache[serviceId] = await res.json();
    }
    var match = employeeCache[serviceId].find(function (e) { return e.id === employeeId; });
    return match ? (escapeHtml(match.f_name) + ' ' + escapeHtml(match.l_name)) : t('barber_fallback');
  }

  async function loadEmployeeOptions() {
    if (!isStaff) return;
    var res = await fetch('/employee/all');
    var employees = await res.json();
    var select = document.getElementById('employeeSelect');
    employees.forEach(function (e) {
      var opt = document.createElement('option');
      opt.value = e.id;
      opt.textContent = e.f_name + ' ' + e.l_name;
      select.appendChild(opt);
    });
  }

  function showError(message) {
    var el = document.getElementById('pageError');
    el.textContent = message;
    el.style.display = 'block';
  }
  function clearError() {
    document.getElementById('pageError').style.display = 'none';
  }

  async function changeStatus(appointmentId, newStatus) {
    clearError();
    var res = await fetch('/appointment/' + appointmentId + '/status?status=' + newStatus, { method: 'PUT' });
    if (res.ok) {
      refresh();
    } else {
      var data = await res.json();
      showError(data.detail || t('err_status_change'));
      refresh();
    }
  }

  function statusSelect(appointmentId, current) {
    var statuses = ['pending', 'confirmed', 'completed', 'cancelled', 'no_show'];
    var select = document.createElement('select');
    select.className = 'status-select';
    statuses.forEach(function (s) {
      var opt = document.createElement('option');
      opt.value = s;
      opt.textContent = statusLabel(s);
      if (s === current.toLowerCase()) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener('click', function (e) { e.stopPropagation(); });
    select.addEventListener('change', function () {
      changeStatus(appointmentId, select.value);
    });
    return select;
  }

  // Shared expandable detail: reschedule (real availability slots) + per-service reprice.
  // Attached to any card that represents one appointment, whether reached via the
  // salon-wide view or a specific employee's view — both edit the same underlying appointment.
  function attachExpandableDetail(card, appointmentId) {
    var detail = document.createElement('div');
    detail.className = 'appt-detail';
    detail.innerHTML =
      '<div class="reschedule-panel">' +
        '<div class="section-title" style="margin-bottom:0;">' + t('reschedule_label') + '</div>' +
        '<input type="date" class="field-input reschedule-date" style="font-family: var(--font-body); max-width: 180px;" />' +
        '<div class="slots-grid reschedule-slots"></div>' +
        '<button type="button" class="small-save-btn reschedule-save-btn" style="align-self:flex-start;" disabled>' + t('save_new_time') + '</button>' +
      '</div>' +
      '<div class="detail-services"></div>';
    card.appendChild(detail);

    var expandBtn = document.createElement('button');
    expandBtn.type = 'button';
    expandBtn.className = 'card-expand-btn';
    expandBtn.setAttribute('aria-label', 'Expand appointment');
    expandBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
    card.querySelector('.cal-card-top').appendChild(expandBtn);

    var loaded = false;
    var appointmentServices = [];
    var selectedRescheduleSlot = null;

    expandBtn.addEventListener('click', async function () {
      var isOpen = detail.classList.toggle('open');
      expandBtn.classList.toggle('open', isOpen);
      if (isOpen && !loaded) {
        loaded = true;
        appointmentServices = await loadServicesIntoDetail(appointmentId, detail);
      }
    });

    var dateInput = detail.querySelector('.reschedule-date');
    var slotsGrid = detail.querySelector('.reschedule-slots');
    var saveBtn = detail.querySelector('.reschedule-save-btn');

    dateInput.addEventListener('click', function (e) { e.stopPropagation(); });
    dateInput.addEventListener('change', async function (e) {
      e.stopPropagation();
      selectedRescheduleSlot = null;
      saveBtn.disabled = true;
      slotsGrid.innerHTML = '';
      if (!appointmentServices.length) return;

      var payload = {
        services: appointmentServices.map(function (s) { return { employee_id: s.employee_id, service_id: s.service_id }; }),
        date: dateInput.value,
        exclude_appointment_id: appointmentId
      };
      var res = await fetch('/appointment/availability', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      });
      var data = await res.json();

      if (!data.slots || data.slots.length === 0) {
        slotsGrid.innerHTML = '<div class="slots-empty">' + t('no_times_today') + '</div>';
        return;
      }
      data.slots.forEach(function (iso) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'slot-btn';
        btn.textContent = formatTime(iso);
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          slotsGrid.querySelectorAll('.slot-btn').forEach(function (b) { b.classList.remove('selected'); });
          btn.classList.add('selected');
          selectedRescheduleSlot = iso;
          saveBtn.disabled = false;
        });
        slotsGrid.appendChild(btn);
      });
    });

    saveBtn.addEventListener('click', async function (e) {
      e.stopPropagation();
      if (!selectedRescheduleSlot) return;
      clearError();
      var res = await fetch('/appointment/' + appointmentId + '/reschedule', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ start_time: selectedRescheduleSlot })
      });
      if (res.ok) {
        refresh();
      } else {
        var data = await res.json();
        showError(data.detail || t('err_reschedule'));
      }
    });
  }

async function loadServicesIntoDetail(appointmentId, detail) {
    var container = detail.querySelector('.detail-services');
    container.innerHTML = '<div class="cal-card-sub">' + t('loading') + '</div>';

    var res = await fetch('/appointment/' + appointmentId);
    var data = await res.json();

    var html = '';
    for (var i = 0; i < data.services.length; i++) {
      var s = data.services[i];
      var employeeName = await resolveEmployeeName(s.service_id, s.employee_id);
      html +=
        '<div class="appt-detail-service">' +
          '<div>' +
            '<div class="appt-service-name">' + (serviceMap[s.service_id] || t('service_fallback')) + '</div>' +
            '<div class="appt-service-sub">' + t('with_prefix') + ' ' + employeeName + ' · ' + formatTime(s.start_time) + '</div>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:8px;">' +
            '<input type="number" class="reprice-input" value="' + s.price + '" data-id="' + s.id + '" min="0" />' +
            '<button type="button" class="small-save-btn reprice-save-btn" data-id="' + s.id + '">' + t('reprice_save_btn') + '</button>' +
          '</div>' +
        '</div>';
    }

    if (data.appointment && data.appointment.note) {
      html += '<div class="appt-note">"' + escapeHtml(data.appointment.note) + '"</div>';
    }

    container.innerHTML = html;

    container.querySelectorAll('input').forEach(function (input) {
      input.addEventListener('click', function (e) { e.stopPropagation(); });
    });
    container.querySelectorAll('.reprice-save-btn').forEach(function (btn) {
      btn.addEventListener('click', async function (e) {
        e.stopPropagation();
        clearError();
        var id = btn.getAttribute('data-id');
        var input = container.querySelector('.reprice-input[data-id="' + id + '"]');
        var res = await fetch('/appointment/appointment_service/' + id + '/price', {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ price: parseFloat(input.value) })
        });
        if (res.ok) {
          refresh();
        } else {
          var data = await res.json();
          showError(data.detail || t('err_reprice'));
        }
      });
    });

    return data.services;
}

  function renderSalonWideDay(appointments) {
    var body = document.getElementById('calendarBody');
    body.innerHTML = '';
    if (appointments.length === 0) {
      body.innerHTML = '<div class="cart-empty">' + t('no_appointments_day') + '</div>';
      return;
    }
    appointments.forEach(function (a) {
      var card = document.createElement('div');
      card.className = 'cal-card';
      var clientName = clientMap[a.client_id] || (a.phone || t('unknown_client'));
      card.innerHTML =
        '<div class="cal-card-top">' +
          '<div>' +
            '<div class="cal-card-time">' + formatTime(a.start_time) + '</div>' +
            '<div class="cal-card-sub">' + clientName + (a.phone ? ' · ' + escapeHtml(a.phone) : '') + '</div>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:10px;" class="status-cell"></div>' +
        '</div>' +
        '<div class="cal-card-price" style="margin-top:6px;">' + formatPrice(a.total_price) + '</div>';
      card.querySelector('.status-cell').appendChild(statusSelect(a.id, a.status));
      body.appendChild(card);
      if (isStaff) attachExpandableDetail(card, a.id);
    });
  }

  function renderEmployeeDay(services) {
    var body = document.getElementById('calendarBody');
    body.innerHTML = '';
    if (services.length === 0) {
      var clientName = s.client_name ? escapeHtml(s.client_name) : t('unknown_client');
      return;
    }
    services.forEach(function (s) {
      var card = document.createElement('div');
      card.className = 'cal-card';
      var clientName = s.client_name || t('unknown_client');
      card.innerHTML =
        '<div class="cal-card-top">' +
          '<div>' +
            '<div class="cal-card-time">' + formatTime(s.start_time) + '</div>' +
            '<div class="cal-card-sub">' + clientName + ' · ' + (serviceMap[s.service_id] || t('service_fallback')) + (s.note ? '<br>"' + escapeHtml(s.note) + '"' : '') + '</div>' +          '</div>' +
          '<div style="display:flex;align-items:center;gap:10px;" class="status-cell"></div>' +
        '</div>' +
        '<div class="cal-card-price" style="margin-top:6px;">' + formatPrice(s.price) + '</div>';
      card.querySelector('.status-cell').appendChild(statusSelect(s.appointment_id, s.status));
      body.appendChild(card);
      if (isStaff) attachExpandableDetail(card, s.appointment_id);
    });
  }

  function renderMonthList(buckets, onDayClick) {
    var body = document.getElementById('calendarBody');
    body.innerHTML = '';
    Object.keys(buckets).sort(function (a, b) { return Number(a) - Number(b); }).forEach(function (day) {
      var items = buckets[day];
      var countLabel = items.length === 0
        ? t('no_appointments_month')
        : items.length + ' ' + (items.length === 1 ? t('appointment_singular') : t('appointment_plural'));
      var row = document.createElement('div');
      row.className = 'month-day-row';
      row.innerHTML =
        '<div class="month-day-num">' + day + '</div>' +
        '<div class="month-day-count">' + countLabel + '</div>';
      row.addEventListener('click', function () { onDayClick(day); });
      body.appendChild(row);
    });
  }

  async function loadDay() {
    var date = document.getElementById('calDate').value;
    var employeeId = isStaff ? document.getElementById('employeeSelect').value : ownEmployeeId;

    if (employeeId) {
      var res = await fetch('/employee/' + employeeId + '/calendar/day?date=' + date);
      var data = await res.json();
      renderEmployeeDay(data);
    } else {
      var res2 = await fetch('/calendar/day?date=' + date);
      var data2 = await res2.json();
      renderSalonWideDay(data2);
    }
  }

  async function loadMonth() {
    var date = document.getElementById('calDate').value;
    var parts = date.split('-');
    var year = parts[0], month = parts[1];
    var employeeId = isStaff ? document.getElementById('employeeSelect').value : ownEmployeeId;

    var url = employeeId
      ? '/employee/' + employeeId + '/calendar/month?year=' + year + '&month=' + month
      : '/calendar/month?year=' + year + '&month=' + month;

    var res = await fetch(url);
    var buckets = await res.json();

    renderMonthList(buckets, function (day) {
      document.getElementById('calDate').value = year + '-' + month + '-' + pad(Number(day));
      setView('day');
    });
  }

  function refresh() {
    if (currentView === 'day') loadDay(); else loadMonth();
  }

  function setView(view) {
    currentView = view;
    document.querySelectorAll('.view-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-view') === view);
    });
    refresh();
  }

  document.querySelectorAll('.view-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { setView(btn.getAttribute('data-view')); });
  });
  document.getElementById('calDate').addEventListener('change', refresh);
  if (isStaff) {
    document.getElementById('employeeSelect').addEventListener('change', refresh);
  }

  var wiCart = [];
  var wiSelectedSlot = null;

  function openWalkinModal() {
    wiCart = [];
    wiSelectedSlot = null;
    document.getElementById('wiFirstName').value = '';
    document.getElementById('wiLastName').value = '';
    document.getElementById('wiPhone').value = '';
    document.getElementById('wiDateInput').value = '';
    document.getElementById('wiSlotsSection').style.display = 'none';
    document.getElementById('walkinError').style.display = 'none';
    renderWiCart();
    loadWiServices();
    document.getElementById('walkinOverlay').classList.add('visible');
  }

  function closeWalkinModal() {
    document.getElementById('walkinOverlay').classList.remove('visible');
  }

  async function loadWiServices() {
    var res = await fetch('/service/all');
    var services = await res.json();
    var byCategory = {};
    services.forEach(function (s) {
      if (!s.active) return;
      if (!byCategory[s.category]) byCategory[s.category] = [];
      byCategory[s.category].push(s);
    });
    var container = document.getElementById('wiServicesList');
    container.innerHTML = '';
    Object.keys(byCategory).forEach(function (category) {
      var title = document.createElement('div');
      title.className = 'category-title';
      title.textContent = categoryLabel(category);
      container.appendChild(title);
      byCategory[category].forEach(function (service) {
        container.appendChild(buildWiServiceRow(service));
      });
    });
  }

  function buildWiServiceRow(service) {
    var row = document.createElement('div');
    row.className = 'service-row';
    row.innerHTML =
      '<div class="service-row-main">' +
        '<div>' +
          '<div class="service-name">' + escapeHtml(service.description) + '</div>' +
          '<div class="service-meta">' + service.time_duration + ' ' + (window.LANG === 'ar' ? 'دقيقة' : 'min') + '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:12px;">' +
          '<div class="service-price">' + formatPrice(service.price) + '</div>' +
          '<button class="add-btn" type="button" aria-label="Add">+</button>' +
        '</div>' +
      '</div>' +
      '<div class="employee-picker">' +
        '<select><option value="">' + t('loading_barbers') + '</option></select>' +
        '<button type="button" class="confirm-add-btn">' + t('add_to_cart') + '</button>' +
      '</div>';

    var addBtn = row.querySelector('.add-btn');
    var picker = row.querySelector('.employee-picker');
    var select = row.querySelector('select');
    var confirmBtn = row.querySelector('.confirm-add-btn');
    var loaded = false;

    addBtn.addEventListener('click', async function () {
      picker.classList.toggle('open');
      if (picker.classList.contains('open') && !loaded) {
        loaded = true;
        var res = await fetch('/service/' + service.id + '/employees');
        var employees = await res.json();
        select.innerHTML = employees.length === 0
          ? '<option value="">' + t('no_barber_available') + '</option>'
          : employees.map(function (e) { return '<option value="' + e.id + '">' + escapeHtml(e.f_name) + ' ' + escapeHtml(e.l_name) + '</option>'; }).join('');
      }
    });

    confirmBtn.addEventListener('click', function () {
      var employeeId = select.value;
      if (!employeeId) return;
      wiCart.push({
        service_id: service.id,
        employee_id: parseInt(employeeId, 10),
        name: service.description,
        employee_name: select.options[select.selectedIndex].textContent,
        price: service.price
      });
      picker.classList.remove('open');
      renderWiCart();
    });

    return row;
  }

  function renderWiCart() {
    var list = document.getElementById('wiCartList');
    if (wiCart.length === 0) {
      list.innerHTML = '<div class="cart-empty">' + t('no_services_yet') + '</div>';
      document.getElementById('wiSlotsSection').style.display = 'none';
      return;
    }
    list.innerHTML = '';
    wiCart.forEach(function (item, index) {
      var el = document.createElement('div');
      el.className = 'cart-item';
      el.innerHTML =
        '<div>' +
          '<div class="cart-item-name">' + escapeHtml(item.name) + '</div>' +
          '<div class="cart-item-sub">' + t('with_prefix') + ' ' + escapeHtml(item.employee_name) + '</div>' +
        '</div>' +
        '<div class="cart-item-right">' +
          '<div class="cart-item-price">' + formatPrice(item.price) + '</div>' +
          '<button class="remove-btn" type="button" data-index="' + index + '">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
          '</button>' +
        '</div>';
      list.appendChild(el);
    });
    list.querySelectorAll('.remove-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        wiCart.splice(parseInt(btn.getAttribute('data-index'), 10), 1);
        renderWiCart();
      });
    });
    if (document.getElementById('wiDateInput').value) refreshWiSlots();
  }

  async function refreshWiSlots() {
    var dateVal = document.getElementById('wiDateInput').value;
    var section = document.getElementById('wiSlotsSection');
    var grid = document.getElementById('wiSlotsGrid');
    wiSelectedSlot = null;
    if (!dateVal || wiCart.length === 0) { section.style.display = 'none'; return; }

    var payload = {
      services: wiCart.map(function (item) { return { employee_id: item.employee_id, service_id: item.service_id }; }),
      date: dateVal
    };
    var res = await fetch('/appointment/availability', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    });
    var data = await res.json();
    section.style.display = 'block';
    grid.innerHTML = '';
    if (!data.slots || data.slots.length === 0) {
      grid.innerHTML = '<div class="slots-empty">' + t('no_times_today') + '</div>';
      return;
    }
    data.slots.forEach(function (iso) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'slot-btn';
      btn.textContent = new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      btn.addEventListener('click', function () {
        grid.querySelectorAll('.slot-btn').forEach(function (b) { b.classList.remove('selected'); });
        btn.classList.add('selected');
        wiSelectedSlot = iso;
      });
      grid.appendChild(btn);
    });
  }

  function showWiError(msg) {
    var el = document.getElementById('walkinError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  if (isStaff) {
    document.getElementById('newApptFab').addEventListener('click', openWalkinModal);
    document.getElementById('walkinCloseBtn').addEventListener('click', closeWalkinModal);
    document.getElementById('wiDateInput').addEventListener('change', refreshWiSlots);

    document.getElementById('wiSubmitBtn').addEventListener('click', async function () {
      document.getElementById('walkinError').style.display = 'none';

      var fName = document.getElementById('wiFirstName').value.trim();
      var lName = document.getElementById('wiLastName').value.trim();
      var phone = document.getElementById('wiPhone').value.trim();

      if (!fName || !lName || !phone) { showWiError(t('wi_fill_client')); return; }
      if (wiCart.length === 0) { showWiError(t('err_add_service')); return; }
      if (!wiSelectedSlot) { showWiError(t('err_choose_time')); return; }

      var payload = {
        client: { f_name: fName, l_name: lName, phone: phone },
        services: wiCart.map(function (item) { return { employee_id: item.employee_id, service_id: item.service_id }; }),
        start_time: wiSelectedSlot
      };

      var res = await fetch('/appointment/walk-in', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      });

      if (!res.ok) {
        var err = await res.json();
        showWiError(err.detail || t('wi_could_not_create'));
        return;
      }

      var data = await res.json();
      var confirmRes = await fetch('/appointment/' + data.appointment.id + '/status?status=confirmed', { method: 'PUT' });

      closeWalkinModal();
      refresh();

      if (!confirmRes.ok) {
        var confirmErr = await confirmRes.json();
        showError(t('wi_confirmation_failed_prefix') + (confirmErr.detail || confirmRes.status));
      }
    });
  }

  document.getElementById('calDate').value = todayStr();

    (async function init() {
      try { await loadServiceMap(); } catch (e) { console.error(e); }
      try { await loadClientMap(); } catch (e) { console.error(e); }
      try { await loadEmployeeOptions(); } catch (e) { console.error(e); }

      var params = new URLSearchParams(window.location.search);
      var preselect = params.get('employee');
      if (isStaff && preselect) {
        document.getElementById('employeeSelect').value = preselect;
      }

      refresh();
  })();
</script>
{% endblock %}
