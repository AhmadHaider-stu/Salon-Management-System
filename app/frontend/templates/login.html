<!DOCTYPE html>
<html lang="{{ request.session.get('lang', 'ar') }}" dir="{{ 'rtl' if request.session.get('lang', 'ar') == 'ar' else 'ltr' }}" translate="no">

<head>
  <title>{{ t(request, 'sign_in_title') }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" content="notranslate" />
  <link rel="stylesheet" href="/static/css/base.css" />
</head>

<body>
  <div class="screen">
    <div class="auth-card">
      <div class="brand-mark-row">
      <div class="brand-mark" style="margin-bottom:0;">Ayman Matar Salon</div>
      <div class="barber-pole lg"></div>

      </div>
      <div class="brand-sub"></div>

      {% if error %}
      <div class="error-banner">
        {% if error == "blocked" %}
          {{ t(request, 'err_blocked') }}
        {% else %}
          {{ t(request, 'err_signin_generic') }}
        {% endif %}
      </div>
      {% endif %}

      <div class="auth-headline">{{ t(request, 'welcome_headline') }}</div>
      <div class="auth-body">{{ t(request, 'signin_body') }}</div>

      <a href="/login" class="btn btn-google">
        <span class="google-icon"></span>
        {{ t(request, 'continue_google') }}
      </a>
    </div>
  </div>
</body>

</html>
