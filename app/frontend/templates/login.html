<!DOCTYPE html>
<html>
  <head>
    <title>Login - Salon App</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h4>FastAPI with Google OAuth</h4>
        <div class="img-box">
          <img class="img" src="{{ url_for('static', path='icons/avatar.png') }}" />
        </div>
      </div>
      
      {% if error %}
      <div class="error-message" style="color: red; text-align: center; margin: 10px 0;">
        {{ error }}
      </div>
      {% endif %}
      
      <a href="/login" class="google-btn">
        <div class="google-icon"></div>
        <span class="btn-text">Sign in with Google</span>
      </a>
    </div>
  </body>
</html>
