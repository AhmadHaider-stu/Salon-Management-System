<!DOCTYPE html>
<html>

<head>
  <title>Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}" />
</head>

<body>
  <div class="screen">
    <div class="auth-card">
      <div class="brand-mark">Ayman Matar Salon</div>
      <div class="brand-sub"></div>

      {% if error %}
      <div class="error-banner">
        {% if error == "blocked" %}
          Your account has been blocked. Contact the salon for help.
        {% else %}
          Something went wrong signing you in. Try again.
        {% endif %}
      </div>
      {% endif %}

      <div class="auth-headline">Welcome</div>
      <div class="auth-body">Sign in to book an appointment or manage your visits.</div>

      <a href="/login" class="btn btn-google">
        <span class="google-icon"></span>
        Continue with Google
      </a>
    </div>
  </div>
</body>

</html>
