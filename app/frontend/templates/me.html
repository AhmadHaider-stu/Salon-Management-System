{% extends "base.html" %}

{% block title %}Me · Ayman Matar Salon{% endblock %}

{% block content %}
{% set lang = request.session.get('lang', 'ar') %}
<div class="page" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
  <div class="page-title">{{ t(request, 'me_title') }}</div>
  <div class="page-sub">{{ t(request, 'me_sub') }}</div>

  <div class="section-title">{{ t(request, 'language_label') }}</div>
  <div class="lang-switcher" style="margin-bottom: 28px;">
    <form method="post" action="/login/set-language" style="display:contents;">
      <input type="hidden" name="lang" value="ar" />
      <button type="submit" class="lang-option {{ 'active' if lang == 'ar' else '' }}">العربية</button>
    </form>
    <form method="post" action="/login/set-language" style="display:contents;">
      <input type="hidden" name="lang" value="en" />
      <button type="submit" class="lang-option {{ 'active' if lang == 'en' else '' }}">English</button>
    </form>
  </div>

  <div class="me-avatar-row" id="avatarRow" style="display:none;">
    <div id="avatarContainer"></div>
    <div id="photoUploadControls" style="display:none;">
      <input type="file" id="photoInput" accept="image/*" style="display:none;" />
      <button type="button" class="me-avatar-upload-btn" id="uploadBtn"></button>
      <span class="me-save-status" id="photoStatus" style="display:none;"></span>
    </div>
  </div>

  <div class="me-section">
    <div class="field-group">
      <label class="field-label" for="fNameField" id="firstNameLabel"></label>
      <input type="text" id="fNameField" class="field-input" style="font-family: var(--font-body);" />
    </div>
    <div class="field-group">
      <label class="field-label" for="lNameField" id="lastNameLabel"></label>
      <input type="text" id="lNameField" class="field-input" style="font-family: var(--font-body);" />
    </div>
  </div>

  <div class="me-section">
    <div class="field-group">
      <label class="field-label" id="emailLabel"></label>
      <input type="text" id="emailField" class="field-input" style="font-family: var(--font-body);" disabled />
    </div>
    <div class="field-group">
      <label class="field-label" for="phoneField" id="phoneLabel"></label>
      <input type="tel" id="phoneField" class="field-input" inputmode="numeric" pattern="[0-9+]*" style="font-family: var(--font-body);" />
    </div>
  </div>

  <div class="me-section" id="staffSection" style="display:none;">
    <div class="section-title" id="salonProfileTitle"></div>
    <div class="field-group">
      <label class="field-label" for="bioField" id="bioLabel"></label>
      <textarea id="bioField" class="field-input" style="font-family: var(--font-body); min-height: 80px; resize: vertical;"></textarea>
    </div>
    <div class="field-group">
      <label class="field-label" for="socialField" id="socialLabel"></label>
      <input type="text" id="socialField" class="field-input" style="font-family: var(--font-body);" placeholder="https://instagram.com/..." />
    </div>
  </div>

  <button type="button" class="me-save-btn" id="saveAllBtn"></button>
  <span class="me-save-status" id="saveAllStatus" style="display:none;"></span>

  <div id="meError" style="display:none;" class="error-banner" style="margin-top: 16px;"></div>

  <form method="post" action="/logout" style="margin-top: 32px;">
    <button type="submit" class="delete-btn-full shortcut-card primary" id="logoutBtn"></button>
  </form>
</div>

<script>
  var currentEmployeeId = null;

  document.getElementById('uploadBtn').textContent = t('change_photo');
  document.getElementById('firstNameLabel').textContent = t('first_name');
  document.getElementById('lastNameLabel').textContent = t('last_name');
  document.getElementById('emailLabel').textContent = t('email_label');
  document.getElementById('phoneLabel').textContent = t('phone_label');
  document.getElementById('salonProfileTitle').textContent = t('salon_profile');
  document.getElementById('bioLabel').textContent = t('bio_label');
  document.getElementById('socialLabel').textContent = t('social_label');
  document.getElementById('saveAllBtn').textContent = t('save_changes');
  document.getElementById('logoutBtn').textContent = t('log_out');

  function showStatus(id) {
    var el = document.getElementById(id);
    el.textContent = t('saved_status');
    el.style.display = 'inline';
    setTimeout(function () { el.style.display = 'none'; }, 2000);
  }

  function showError(message) {
    var el = document.getElementById('meError');
    el.textContent = message;
    el.style.display = 'block';
  }
  function clearError() {
    document.getElementById('meError').style.display = 'none';
  }

  function renderAvatar(photoUrl, initials) {
    var container = document.getElementById('avatarContainer');
    if (photoUrl) {
      container.innerHTML = '<img src="' + escapeHtml(photoUrl) + '" alt="" class="me-avatar" id="avatarImg" />';
    } else {
      container.innerHTML = '<div class="me-avatar-fallback">' + escapeHtml(initials) + '</div>';
    }
  }

  async function loadMe() {
    var res = await fetch('/user/me');
    var user = await res.json();

    document.getElementById('fNameField').value = user.f_name || '';
    document.getElementById('lNameField').value = user.l_name || '';
    document.getElementById('emailField').value = user.email || '';
    document.getElementById('phoneField').value = user.phone || '';

    var initials = ((user.f_name || ' ')[0] + (user.l_name || ' ')[0]).toUpperCase();

    if (user.employee_id) {
      currentEmployeeId = user.employee_id;
      document.getElementById('staffSection').style.display = 'block';
      document.getElementById('avatarRow').style.display = 'flex';
      document.getElementById('photoUploadControls').style.display = 'block';

      var empRes = await fetch('/employee/' + user.employee_id);
      var employee = await empRes.json();
      document.getElementById('bioField').value = employee.bio || '';
      document.getElementById('socialField').value = employee.socialMedia || '';
      renderAvatar(employee.photo, initials);
    } else {
      renderAvatar(null, initials);
      document.getElementById('avatarRow').style.display = 'flex';
    }
  }

  document.getElementById('saveAllBtn').addEventListener('click', async function () {
    clearError();
    var errors = [];

    var nameRes = await fetch('/user/rename', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        f_name: document.getElementById('fNameField').value,
        l_name: document.getElementById('lNameField').value
      })
    });
    if (!nameRes.ok) {
      var nameErr = await nameRes.json();
      errors.push(t('err_name_prefix') + ': ' + (nameErr.detail || t('err_could_not_save')));
    }

    var phoneRes = await fetch('/user/update-phone', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: document.getElementById('phoneField').value })
    });
    if (phoneRes.ok) {
      var updated = await phoneRes.json();
      document.getElementById('phoneField').value = updated.phone;
    } else {
      var phoneErr = await phoneRes.json();
      errors.push(t('err_phone_prefix') + ': ' + (phoneErr.detail || t('err_could_not_save')));
    }

    if (currentEmployeeId) {
      var profileRes = await fetch('/employee/' + currentEmployeeId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          bio: document.getElementById('bioField').value || null,
          socialMedia: document.getElementById('socialField').value || null
        })
      });
      if (!profileRes.ok) {
        var profileErr = await profileRes.json();
        errors.push(t('err_profile_prefix') + ': ' + (profileErr.detail || t('err_could_not_save')));
      }
    }

    if (errors.length === 0) {
      showStatus('saveAllStatus');
    } else {
      showError(errors.join(' · '));
    }
  });

  document.getElementById('uploadBtn').addEventListener('click', function () {
    document.getElementById('photoInput').click();
  });

  document.getElementById('photoInput').addEventListener('change', async function () {
    var file = this.files[0];
    if (!file) return;
    if (!currentEmployeeId) {
      showError(t('err_could_not_load_profile'));
      return;
    }

    clearError();
    var formData = new FormData();
    formData.append('file', file);

    try {
      var res = await fetch('/employee/' + currentEmployeeId + '/photo', {
        method: 'PUT',
        body: formData
      });

      if (res.ok) {
        var data = await res.json();
        renderAvatar(data.photo_url, '');
        showStatus('photoStatus');
      } else {
        var errData = await res.json();
        showError(t('err_upload_failed') + ': ' + (errData.detail || res.status));
      }
    } catch (err) {
      showError(t('err_network_upload') + ': ' + err.message);
    }
  });

  loadMe();
</script>
{% endblock %}
