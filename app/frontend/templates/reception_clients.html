{% extends "base.html" %}

{% block title %}Clients · Ayman Matar Salon{% endblock %}

{% block content %}
{% set lang = request.session.get('lang', 'ar') %}
<div class="page" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
  <div class="page-title" id="pageTitle"></div>
  <div class="page-sub" id="pageSub"></div>

  <div id="pageError" style="display:none;" class="error-banner"></div>

  <div id="clientList"></div>
</div>

<script>
  document.getElementById('pageTitle').textContent = t('clients_title');
  document.getElementById('pageSub').textContent = t('clients_sub');

  function showError(message) {
    var el = document.getElementById('pageError');
    el.textContent = message;
    el.style.display = 'block';
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function formatTime(iso) {
    return new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }
  function formatPrice(value) {
    var amount = Number(value).toFixed(0);
    return window.LANG === 'ar' ? (amount + ' ' + t('currency')) : (t('currency') + ' ' + amount);
  }
  function statusBadgeClass(status) {
    return 'status-badge status-' + status.toLowerCase();
  }
  function statusLabel(status) {
    var entry = window.STATUS_LABELS[status.toLowerCase()];
    if (entry) return entry[window.LANG] || entry.en;
    return status;
  }

  async function loadClients() {
    var res = await fetch('/client');
    var clients = await res.json();

    var list = document.getElementById('clientList');
    list.innerHTML = '';

    if (clients.length === 0) {
      list.innerHTML = '<div class="cart-empty">' + t('no_clients_yet') + '</div>';
      return;
    }

    clients.forEach(function (client) {
      list.appendChild(buildClientCard(client));
    });
  }

  function buildClientCard(client) {
    var card = document.createElement('div');
    card.className = 'cal-card clickable';
    card.innerHTML =
      '<div class="cal-card-top">' +
        '<div>' +
          '<div class="cal-card-time">' + escapeHtml(client.f_name) + ' ' +  escapeHtml(client.l_name )+ '</div>' +
          '<div class="cal-card-sub">' +escapeHtml(client.phone || '—') + (client.email ? ' · ' + escapeHtml( client.email) : '') + '</div>' +
        '</div>' +
        '<button type="button" class="card-expand-btn" aria-label="Expand client">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="appt-detail"></div>';

    var detail = card.querySelector('.appt-detail');
    var expandBtn = card.querySelector('.card-expand-btn');
    var loaded = false;

    expandBtn.addEventListener('click', async function () {
      var isOpen = detail.classList.toggle('open');
      expandBtn.classList.toggle('open', isOpen);
      if (isOpen && !loaded) {
        loaded = true;
        await loadClientAppointments(client.id, detail);
      }
    });

    return card;
  }

  async function loadClientAppointments(clientId, detail) {
    detail.innerHTML = '<div class="cal-card-sub">' + t('loading') + '</div>';

    var res = await fetch('/client/' + clientId + '/appointments');
    if (!res.ok) {
      showError(t('err_load_history'));
      detail.innerHTML = '<div class="cal-card-sub">' + t('err_load_appointments_short') + '</div>';
      return;
    }
    var appointments = await res.json();

    if (appointments.length === 0) {
      detail.innerHTML = '<div class="cal-card-sub">' + t('no_appointments_yet_client') + '</div>';
      return;
    }

    appointments.sort(function (a, b) { return new Date(b.start_time) - new Date(a.start_time); });

    var html = '';
    appointments.forEach(function (a) {
      html +=
        '<div class="appt-detail-service">' +
          '<div>' +
            '<div class="appt-service-name">' + formatDate(a.start_time) + '</div>' +
            '<div class="appt-service-sub">' + formatTime(a.start_time) + ' – ' + formatTime(a.end_time) + ' · <span class="' + statusBadgeClass(a.status) + '">' + statusLabel(a.status) + '</span></div>' +
          '</div>' +
          '<div class="cart-item-price">' + formatPrice(a.total_price) + '</div>' +
        '</div>';
    });
    detail.innerHTML = html;
  }

  loadClients();
</script>
{% endblock %}
