{% extends "base.html" %}

{% block title %}Employees · Salon-Management-System{% endblock %}

{% block content %}
{% set lang = request.session.get('lang', 'ar') %}
<div class="page" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
  <div class="page-title" id="pageTitle"></div>
  <div class="page-sub" id="pageSub"></div>

  <div id="pageError" style="display:none;" class="error-banner"></div>

  <div id="employeeList"></div>
</div>

<script>
  document.getElementById('pageTitle').textContent = t('employees_title');
  document.getElementById('pageSub').textContent = t('employees_sub');

  var DAYS = [
    { value: 'sunday', key: 'day_sunday' },
    { value: 'monday', key: 'day_monday' },
    { value: 'tuesday', key: 'day_tuesday' },
    { value: 'wednesday', key: 'day_wednesday' },
    { value: 'thursday', key: 'day_thursday' },
    { value: 'friday', key: 'day_friday' },
    { value: 'saturday', key: 'day_saturday' }
  ];

  var allServices = [];
  var calendarArrow = window.LANG === 'ar' ? ' ←' : ' →';

  function showError(message) {
    var el = document.getElementById('pageError');
    el.textContent = message;
    el.style.display = 'block';
  }
  function clearError() {
    document.getElementById('pageError').style.display = 'none';
  }

  async function loadAllServices() {
    var res = await fetch('/service/all');
    allServices = await res.json();
  }

  async function loadEmployees() {
    clearError();
    var res = await fetch('/employee/all');
    var employees = await res.json();

    var list = document.getElementById('employeeList');
    list.innerHTML = '';

    if (employees.length === 0) {
      list.innerHTML = '<div class="cart-empty">' + t('no_employees_yet') + '</div>';
      return;
    }

    employees.forEach(function (emp) {
      list.appendChild(buildEmployeeCard(emp));
    });
  }

  function buildEmployeeCard(emp) {
    var card = document.createElement('div');
    card.className = 'cal-card clickable';
    card.innerHTML =
      '<div class="cal-card-top">' +
        '<div style="display:flex;align-items:center;gap:12px;">' +
           (emp.photo
            ? '<img src="' + escapeHtml(emp.photo) + '" alt="" class="avatar" />'
            : '<div class="avatar-fallback">' + escapeHtml(emp.f_name ? emp.f_name[0] : '?') + '</div>') +
          '<div>' +
            '<div class="cal-card-time">' + escapeHtml(emp.f_name) + ' ' + escapeHtml(emp.l_name) + '</div>' +
            '<div class="cal-card-sub">' + (emp.phone ? escapeHtml(emp.phone) : t('no_phone')) + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
          '<span class="status-badge ' + (emp.active ? 'status-active' : 'status-inactive') + '">' +
            (emp.active ? t('active_label') : t('inactive_label')) +
          '</span>' +
          '<button type="button" class="card-expand-btn" aria-label="Expand employee"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>' +
        '</div>' +
      '</div>' +
      '<div class="appt-detail" id="emp-detail-' + emp.id + '"></div>';

    var detail = card.querySelector('.appt-detail');
    var expandBtn = card.querySelector('.card-expand-btn');
    var loaded = false;

    expandBtn.addEventListener('click', function () {
      var isOpen = detail.classList.toggle('open');
      expandBtn.classList.toggle('open', isOpen);
      if (isOpen && !loaded) {
        loaded = true;
        buildEmployeeDetail(emp, detail);
      }
    });

    return card;
  }

  async function buildEmployeeDetail(emp, detail) {
    detail.innerHTML = '<div class="cal-card-sub">' + t('loading') + '</div>';

    var empRes = await fetch('/employee/' + emp.id);
    var freshEmp = await empRes.json();

    var scheduleRes = await fetch('/employee/' + emp.id + '/schedule');
    var schedule = await scheduleRes.json();
    var scheduleByDay = {};
    schedule.forEach(function (s) { scheduleByDay[s.day_of_week] = s; });

    var servicesRes = await fetch('/employee/' + emp.id + '/services');
    var assignedServices = await servicesRes.json();
    var assignedIds = assignedServices.map(function (s) { return s.id; });

    detail.innerHTML =
      '<div class="section-title">' + t('profile_title') + '</div>' +
      '<div class="field-group">' +
        '<label class="field-label">' + t('bio_label') + '</label>' +
        '<textarea class="field-input emp-bio" style="font-family: var(--font-body); min-height: 70px; resize: vertical;">' + escapeHtml(freshEmp.bio || '') + '</textarea>' +
      '</div>' +
      '<div class="field-group">' +
        '<label class="field-label">' + t('social_label') + '</label>' +
        '<input type="text" class="field-input emp-social" style="font-family: var(--font-body);" value="' + escapeHtml(freshEmp.socialMedia || '') + '" />' +
      '</div>' +
      '<div class="field-group" style="display:flex;align-items:center;gap:8px;">' +
        '<input type="checkbox" class="emp-active" id="active-' + emp.id + '" ' + (freshEmp.active ? 'checked' : '') + ' />' +
        '<label for="active-' + emp.id + '" style="font-size:13px;">' + t('active_label') + '</label>' +
      '</div>' +
      '<button type="button" class="confirm-add-btn emp-save-profile-btn">' + t('save_profile_btn') + '</button>' +

      '<div class="section-title" style="margin-top:24px;">' + t('assigned_services_title') + '</div>' +
      '<div class="emp-services-list">' +
        allServices.map(function (s) {
          return '<label class="checklist-row"><input type="checkbox" class="emp-service-check" value="' + s.id + '" ' + (assignedIds.indexOf(s.id) !== -1 ? 'checked' : '') + ' /> ' + escapeHtml(s.description) + '</label>';
        }).join('') +
      '</div>' +
      '<button type="button" class="confirm-add-btn emp-save-services-btn">' + t('save_services_btn') + '</button>' +

      '<div class="section-title" style="margin-top:24px;">' + t('weekly_schedule_title') + '</div>' +
      '<div class="emp-schedule-list">' +
        DAYS.map(function (d) {
          var existing = scheduleByDay[d.value];
          var checked = !!existing;
          return (
            '<div class="day-schedule-row">' +
              '<label style="display:flex;align-items:center;gap:8px;width:130px;flex-shrink:0;">' +
                '<input type="checkbox" class="emp-day-check" data-day="' + d.value + '" ' + (checked ? 'checked' : '') + ' />' +
                '<span class="day-schedule-label" style="width:auto;">' + t(d.key) + '</span>' +
              '</label>' +
              '<div class="day-schedule-times" style="' + (checked ? '' : 'display:none;') + '" data-day-times="' + d.value + '">' +
                '<input type="time" class="emp-day-start" data-day="' + d.value + '" value="' + (existing ? existing.start_time.slice(0, 5) : '09:00') + '" />' +
                '<span>–</span>' +
                '<input type="time" class="emp-day-end" data-day="' + d.value + '" value="' + (existing ? existing.end_time.slice(0, 5) : '18:00') + '" />' +
              '</div>' +
            '</div>'
          );
        }).join('') +
      '</div>' +
      '<button type="button" class="confirm-add-btn emp-save-schedule-btn">' + t('save_schedule_btn') + '</button>' +

      '<a href="/reception/calendar?employee=' + emp.id + '" class="text-link" style="display:block;margin-top:18px;">' + t('view_calendar_link') + calendarArrow + '</a>';

    detail.querySelectorAll('input, textarea, button, a').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); });
    });

    detail.querySelectorAll('.emp-day-check').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var day = cb.getAttribute('data-day');
        detail.querySelector('[data-day-times="' + day + '"]').style.display = cb.checked ? 'flex' : 'none';
      });
    });

    detail.querySelector('.emp-save-profile-btn').addEventListener('click', async function () {
      clearError();
      var payload = {
        bio: detail.querySelector('.emp-bio').value || null,
        socialMedia: detail.querySelector('.emp-social').value || null,
        active: detail.querySelector('.emp-active').checked
      };
      var res = await fetch('/employee/' + emp.id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        loadEmployees();
      } else {
        var data = await res.json();
        showError(data.detail || t('err_save_profile'));
      }
    });

    detail.querySelector('.emp-save-services-btn').addEventListener('click', async function () {
      clearError();
      var checked = Array.from(detail.querySelectorAll('.emp-service-check:checked')).map(function (cb) {
        return parseInt(cb.value, 10);
      });
      var res = await fetch('/employee/' + emp.id + '/assign_services', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ services: checked })
      });
      if (res.ok) {
        showError('');
        clearError();
      } else {
        var data = await res.json();
        showError(data.detail || t('err_save_services'));
      }
    });

    detail.querySelector('.emp-save-schedule-btn').addEventListener('click', async function () {
      clearError();
      var entries = [];
      detail.querySelectorAll('.emp-day-check:checked').forEach(function (cb) {
        var day = cb.getAttribute('data-day');
        var start = detail.querySelector('.emp-day-start[data-day="' + day + '"]').value;
        var end = detail.querySelector('.emp-day-end[data-day="' + day + '"]').value;
        entries.push({ day_of_week: day, start_time: start, end_time: end });
      });
      var res = await fetch('/employee/' + emp.id + '/schedule', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entries: entries })
      });
      if (res.ok) {
        clearError();
      } else {
        var data = await res.json();
        showError(data.detail || t('err_save_schedule'));
      }
    });
  }

  (async function init() {
    await loadAllServices();
    await loadEmployees();
  })();
</script>
{% endblock %}
