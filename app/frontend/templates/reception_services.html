{% extends "base.html" %}

{% block title %}Services · Salon-Management-System{% endblock %}

{% block content %}
{% set lang = request.session.get('lang', 'ar') %}
<div class="page" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
  <div class="page-title" id="pageTitle"></div>
  <div class="page-sub" id="pageSub"></div>

  <div id="pageError" style="display:none;" class="error-banner"></div>

  <button type="button" class="btn btn-outline" id="addToggleBtn" style="margin-bottom: 20px;"></button>

  <div class="employee-picker" id="addPanel">
    <div class="field-group">
      <label class="field-label" id="newCategoryLabel"></label>
      <select id="newCategory" class="field-input" style="font-family: var(--font-body);"></select>
    </div>
    <div class="field-group">
      <label class="field-label" id="newDescLabel"></label>
      <input type="text" id="newDescription" class="field-input" style="font-family: var(--font-body);" maxlength="30" />
    </div>
    <div class="field-group">
      <label class="field-label" id="newPriceLabel"></label>
      <input type="number" id="newPrice" class="field-input" style="font-family: var(--font-body);" min="10" max="500" />
    </div>
    <div class="field-group">
      <label class="field-label" id="newDurationLabel"></label>
      <input type="number" id="newDuration" class="field-input" style="font-family: var(--font-body);" min="10" max="180" />
    </div>
    <button type="button" class="confirm-add-btn" id="addSaveBtn"></button>
  </div>

  <div id="servicesList" style="margin-top: 20px;"></div>
</div>

<script>
  document.getElementById('pageTitle').textContent = t('services_title');
  document.getElementById('pageSub').textContent = t('services_mgmt_sub');
  document.getElementById('addToggleBtn').textContent = '+ ' + t('add_service_btn');
  document.getElementById('newCategoryLabel').textContent = t('category_label');
  document.getElementById('newDescLabel').textContent = t('description_label');
  document.getElementById('newPriceLabel').textContent = t('price_label') + ' (' + t('currency') + ')';
  document.getElementById('newDurationLabel').textContent = t('duration_label');
  document.getElementById('addSaveBtn').textContent = t('create_service_btn');

  // Which categories can be picked when creating a NEW service. Existing services in
  // other categories (nails, makeup, waxing) still display and can be edited fine —
  // this only controls what's offered going forward.
  var VISIBLE_CATEGORY_VALUES = ['hair styling', 'facial treatment','Threading and waxing','makeup','nails'];

  function categoryLabel(value) {
    var entry = window.CATEGORY_LABELS[value];
    if (entry) return entry[window.LANG] || entry.ar;
    return value;
  }

  function categoryOptionsHtml(selected) {
    return VISIBLE_CATEGORY_VALUES.map(function (v) {
      return '<option value="' + v + '"' + (v === selected ? ' selected' : '') + '>' + categoryLabel(v) + '</option>';
    }).join('');
  }

  // For editing an EXISTING service: always include its current category, even if it's
  // been hidden from new-service creation, so saving other fields can't silently reassign it.
  function editCategoryOptionsHtml(selected) {
    var html = categoryOptionsHtml(selected);
    if (VISIBLE_CATEGORY_VALUES.indexOf(selected) === -1) {
      html += '<option value="' + selected + '" selected>' + categoryLabel(selected) + '</option>';
    }
    return html;
  }

  function formatPrice(value) {
    var amount = Number(value).toFixed(0);
    return window.LANG === 'ar' ? (amount + ' ' + t('currency')) : (t('currency') + ' ' + amount);
  }

  function showError(message) {
    var el = document.getElementById('pageError');
    el.textContent = message;
    el.style.display = 'block';
  }

  function clearError() {
    document.getElementById('pageError').style.display = 'none';
  }

  document.getElementById('newCategory').innerHTML = categoryOptionsHtml(null);

  document.getElementById('addToggleBtn').addEventListener('click', function () {
    document.getElementById('addPanel').classList.toggle('open');
  });

  document.getElementById('addSaveBtn').addEventListener('click', async function () {
    clearError();
    var payload = {
      category: document.getElementById('newCategory').value,
      description: document.getElementById('newDescription').value,
      price: parseFloat(document.getElementById('newPrice').value),
      time_duration: parseInt(document.getElementById('newDuration').value, 10)
    };

    var res = await fetch('/service/add_service', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      document.getElementById('newDescription').value = '';
      document.getElementById('newPrice').value = '';
      document.getElementById('newDuration').value = '';
      document.getElementById('addPanel').classList.remove('open');
      loadServices();
    } else {
      var data = await res.json();
      showError(data.detail || t('err_create_service'));
    }
  });

  async function loadServices() {
    var res = await fetch('/service/all');
    var services = await res.json();

    var byCategory = {};
    services.forEach(function (s) {
      if (!byCategory[s.category]) byCategory[s.category] = [];
      byCategory[s.category].push(s);
    });

    var container = document.getElementById('servicesList');
    container.innerHTML = '';

    Object.keys(byCategory).forEach(function (category) {
      var title = document.createElement('div');
      title.className = 'category-title';
      title.textContent = categoryLabel(category);
      container.appendChild(title);

      byCategory[category].forEach(function (service) {
        container.appendChild(buildServiceRow(service));
      });
    });
  }

  function buildServiceRow(service) {
    var row = document.createElement('div');
    row.className = 'service-row' + (service.active ? '' : ' inactive');
    row.innerHTML =
      '<div class="service-row-main">' +
        '<div>' +
          '<div class="service-name">' + escapeHtml(service.description) + '</div>' +
          '<div class="service-meta">' + service.time_duration + ' ' + (window.LANG === 'ar' ? 'دقيقة' : 'min') + ' · ' +
            '<span class="status-badge ' + (service.active ? 'status-active' : 'status-inactive') + '">' +
              (service.active ? t('active_label') : t('inactive_label')) +
            '</span>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:12px;">' +
          '<div class="service-price">' + formatPrice(service.price) + '</div>' +
          '<button class="add-btn" type="button" aria-label="Edit">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div class="employee-picker">' +
        '<div class="field-group">' +
          '<label class="field-label">' + t('category_label') + '</label>' +
          '<select class="field-input edit-category" style="font-family: var(--font-body);">' + editCategoryOptionsHtml(service.category) + '</select>' +
        '</div>' +
        '<div class="field-group">' +
          '<label class="field-label">' + t('description_label') + '</label>' +
          '<input type="text" class="field-input edit-description" style="font-family: var(--font-body);" value="' + escapeHtml(service.description) + '" maxlength="30" />' +
        '</div>' +
        '<div class="field-group">' +
          '<label class="field-label">' + t('price_label') + ' (' + t('currency') + ')</label>' +
          '<input type="number" class="field-input edit-price" style="font-family: var(--font-body);" value="' + service.price + '" min="10" max="500" />' +
        '</div>' +
        '<div class="field-group">' +
          '<label class="field-label">' + t('duration_label') + '</label>' +
          '<input type="number" class="field-input edit-duration" style="font-family: var(--font-body);" value="' + service.time_duration + '" min="10" max="180" />' +
        '</div>' +
        '<div class="field-group" style="display:flex;align-items:center;gap:8px;">' +
          '<input type="checkbox" class="edit-active" id="active-' + service.id + '" ' + (service.active ? 'checked' : '') + ' />' +
          '<label for="active-' + service.id + '" style="font-size:13px;">' + t('active_label') + '</label>' +
        '</div>' +
        '<button type="button" class="confirm-add-btn edit-save-btn">' + t('save_changes') + '</button>' +
        '<button type="button" class="delete-btn-full edit-delete-btn">' + t('delete_service_btn') + '</button>' +
      '</div>';

    var editBtn = row.querySelector('.add-btn');
    var panel = row.querySelector('.employee-picker');
    editBtn.addEventListener('click', function () {
      panel.classList.toggle('open');
    });

    row.querySelector('.edit-save-btn').addEventListener('click', async function () {
      clearError();
      var payload = {
        category: row.querySelector('.edit-category').value,
        description: row.querySelector('.edit-description').value,
        price: parseFloat(row.querySelector('.edit-price').value),
        time_duration: parseInt(row.querySelector('.edit-duration').value, 10),
        active: row.querySelector('.edit-active').checked
      };
      var res = await fetch('/service/' + service.id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        loadServices();
      } else {
        var data = await res.json();
        showError(data.detail || t('err_save_service_changes'));
      }
    });

    row.querySelector('.edit-delete-btn').addEventListener('click', async function () {
      if (!confirm(t('confirm_delete_service'))) return;
      clearError();
      var res = await fetch('/service/' + service.id, { method: 'DELETE' });
      if (res.ok) {
        loadServices();
      } else {
        var data = await res.json();
        showError(data.detail || t('err_delete_service'));
      }
    });

    return row;
  }

  loadServices();
</script>
{% endblock %}
