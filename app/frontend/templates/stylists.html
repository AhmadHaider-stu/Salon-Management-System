{% extends "base.html" %}

{% block title %}Our Stylists · Ayman Matar Salon{% endblock %}

{% block content %}
{% set lang = request.session.get('lang', 'ar') %}
<div class="page" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
  <div class="page-title" id="pageTitle"></div>
  <div class="page-sub" id="pageSub"></div>

  <div id="stylistList"></div>
</div>

<script>
  document.getElementById('pageTitle').textContent = t('our_barbers_title');
  document.getElementById('pageSub').textContent = t('meet_the_team');

  function phoneHref(phone) {
    return 'tel:' + phone.replace(/[^0-9+]/g, '');
  }

  async function loadStylists() {
    var res = await fetch('/employee/all');
    var employees = await res.json();
    var active = employees.filter(function (e) { return e.active; });

    var list = document.getElementById('stylistList');
    list.innerHTML = '';

    if (active.length === 0) {
      list.innerHTML = '<div class="cart-empty">' + t('no_barbers_yet') + '</div>';
      return;
    }

    for (var i = 0; i < active.length; i++) {
      list.appendChild(await buildStylistCard(active[i]));
    }
  }

  async function buildStylistCard(emp) {
    var servicesRes = await fetch('/employee/' + emp.id + '/services');
    var services = await servicesRes.json();

    var card = document.createElement('div');
    card.className = 'stylist-card';

    var photoHtml = emp.photo
      ? '<img src="' + emp.photo + '" alt="" class="stylist-photo" />'
      : '<div class="stylist-photo-fallback">' + escapeHtml(emp.f_name[0]) + '</div>';

    var chipsHtml = services.map(function (s) {
      return '<span class="service-chip">' + escapeHtml(s.description) + '</span>';
    }).join('');

    var contactHtml = '';
    if (emp.phone) {
      contactHtml +=
        '<a href="' + phoneHref(emp.phone) + '" class="stylist-contact-link">' +
        '<svg ...></svg>' +
        escapeHtml(emp.phone) +
        '</a>';
    }
    if (emp.socialMedia) {
      var social = safeUrl(emp.socialMedia);  
        if (social) {
          contactHtml +=
            '<a href="' + social + '" target="_blank" rel="noopener" class="stylist-contact-link">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>' +
            'Instagram' +
          '</a>';
            }
    }

    var servicesId = 'chips-' + emp.id;
    var servicesHtml = '';
    if (services.length > 0) {
      servicesHtml =
        '<div class="services-toggle-row" id="toggle-' + emp.id + '">' +
          '<span class="services-toggle-label">' + t('services_title') + ' (' + services.length + ')</span>' +
          '<svg class="cal-card-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
        '</div>' +
        '<div class="chip-list" id="' + servicesId + '">' + chipsHtml + '</div>';
    }

    card.innerHTML =
      '<div class="stylist-card-header">' +
        photoHtml +
        '<div>' +
          '<div class="stylist-card-name">' + escapeHtml(emp.f_name) + ' ' + escapeHtml(emp.l_name) + '</div>' +
          '</div>' +
          '</div>' +
          (emp.bio ? '<div class="stylist-bio">' + escapeHtml(emp.bio) + '</div>' : '') +
      (contactHtml ? '<div class="stylist-contact-row">' + contactHtml + '</div>' : '') +
      servicesHtml;

    var toggleRow = card.querySelector('#toggle-' + emp.id);
    if (toggleRow) {
      toggleRow.addEventListener('click', function () {
        var list = document.getElementById(servicesId);
        var isOpen = list.classList.toggle('open');
        toggleRow.querySelector('.cal-card-chevron').style.transform = isOpen ? 'rotate(180deg)' : '';
      });
    }

    return card;
  }

  loadStylists();
</script>
{% endblock %}
